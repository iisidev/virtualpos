version: '3.8'

services:
  # ----------------------------------------------------
  # 1. DATABASE: PostgreSQL 16 (Ledger Inmutable)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: corpcredit-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER es obligatoria (definirla en el .env de Portainer)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria (definirla en el .env de Portainer)}
      POSTGRES_DB: ${DB_NAME:?DB_NAME es obligatoria (definirla en el .env de Portainer)}
    ports:
      - "${DB_PORT:?DB_PORT es obligatoria (definirla en el .env de Portainer)}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER es obligatoria (definirla en el .env de Portainer)} -d ${DB_NAME:?DB_NAME es obligatoria (definirla en el .env de Portainer)}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 2. CACHE & LOCKS: Redis 7 Alpine
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: corpcredit-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria (definirla en el .env de Portainer)}
    ports:
      - "${REDIS_PORT:?REDIS_PORT es obligatoria (definirla en el .env de Portainer)}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria (definirla en el .env de Portainer)}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 3. WHATSAPP GATEWAY: Official OpenClaw (Baileys/Meta)
  # ----------------------------------------------------
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: corpcredit-openclaw
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /home/node/.openclaw/workspace
        mkdir -p /home/node/.openclaw/skills/corp-credit
        cat > /tmp/corp-credit-policy.md <<'POLICY_EOF'
        # REGLA DE ACCESO POR TIPIFICACIÓN DE CLIENTE (OBLIGATORIA EN WHATSAPP)

        En **CADA** mensaje entrante por WhatsApp (sin importar el tema: saludo, consulta financiera o petición general), **ANTES** de responder o usar otra herramienta, identifica al remitente (`sender`/`from`/JID) y consulta en vivo:

        ```bash
        curl -s -G "$$POS_API_URL/agent/balance" -H "x-agent-key: $$POS_AGENT_KEY" -H "Cache-Control: no-cache" --data-urlencode "phone=<NUMERO_REMITENTE>" --data-urlencode "_t=$$(date +%s)"
        ```

        **Nunca** asumas `classification`, `is_vip`, `agent_mode` ni montos desde la memoria del chat. Valida la respuesta actual:

        ## 1. Si `linked === true` Y `is_vip === true` (`agent_mode: "VIP_FULL_AGENT"`)
        - El cliente tiene Tipificación **VIP**.
        - Tiene permitido interactuar contigo como **agente completo sin restricciones**: además de todas las funciones corporativas de Corp-Credit (usando siempre la API en vivo para cifras y solicitudes), puedes atender libremente cualquier consulta general, redacción, programación, análisis, búsquedas y demás capacidades o herramientas de OpenClaw.

        ## 2. Si `is_vip === false` O `linked === false` (`agent_mode: "CORPORATE_CREDIT_ONLY"` o `"UNLINKED"`)
        - Actúa **ÚNICA Y ESTRICTAMENTE** como agente corporativo de **Corp-Credit**. Está **PROHIBIDO** usar capacidades de asistente general para clientes NO VIP.
        - Si `linked === false`: saluda cordialmente y pide únicamente su **cédula o código de carnet** para vincular (`POST $$POS_API_URL/agent/link`). No respondas otras peticiones hasta vincular y validar su tipificación.
        - Si `linked === true` y `is_vip === false`: estás limitado **ESTRICTAMENTE** a estas funciones y **NADA MÁS**:
          1. Saludar y mostrar el menú corporativo (`1` a `4`).
          2. Informar sus **propios datos** registrados: nombre (`client.full_name`), cargo (`client.job_title`), grado (`client.grade_level`), tipificación (`client.classification`), empresa (`client.employer`), carnet (`client.employee_code`), cédula (`client.national_id`), teléfono (`client.whatsapp_phone`) y fecha de nacimiento (`client.birth_date`). *(Nunca reveles salarios ni datos de terceros).*
          3. Consultar su crédito aprobado (`client.approved_limit`), consumido (`client.used_balance`), disponibilidad de crédito (`client.available_balance`), estado (`client.credit_status`) y si puede comprar (`client.can_purchase`).
          4. Consultar sus movimientos / última compra (`GET $$POS_API_URL/agent/movements`).
          5. Registrar y consultar solicitudes de crédito / aumento (`POST $$POS_API_URL/agent/credit-requests` y `GET $$POS_API_URL/agent/credit-requests`).
        - **Rechazo breve obligatorio fuera de alcance (SOLO NO VIP):** si un cliente NO VIP pide programación, chistes, clima, traducciones, resúmenes, búsquedas web, redacción general, generación de archivos/imágenes o cualquier tema ajeno a estas 5 funciones, **rechaza la solicitud sin ejecutarla ni usar otras herramientas** y responde en **una sola frase corta (máximo 1 o 2 líneas)**, simplemente disculpándote e indicando que solamente puedes apoyarle con su información crediticia.
          - **NO** envíes textos largos, listas ni justificaciones, y **NO** menciones términos técnicos ni internos (`VIP`, `no VIP`, `CORPORATE_CREDIT_ONLY`, `agent_mode`, reglas, permisos o políticas).
          - **Respuesta modelo:** *"Disculpa, solamente puedo apoyarte con tu información crediticia."*
        POLICY_EOF
        cat > /home/node/.openclaw/skills/corp-credit/SKILL.md <<'SKILL_EOF'
        ---
        name: corp-credit
        description: Validar tipificación VIP/corporativa, consultar datos, saldo, crédito disponible y movimientos, vincular número y registrar solicitudes de crédito en Corp-Credit POS.
        version: 1.2.0
        metadata:
          openclaw:
            requires:
              env:
                - POS_API_URL
                - POS_AGENT_KEY
              bins:
                - curl
        ---

        # Corp-Credit: agente corporativo por WhatsApp

        Toda cifra, tipificación (`classification`, `is_vip`) y estado DEBE venir de una consulta nueva a la API en el turno actual; nunca inventes ni recicles datos previos.

        ## Validación de Tipificación (OBLIGATORIA EN CADA MENSAJE)

        Al iniciar cada turno, consulta `/agent/balance` en vivo y verifica `is_vip` y `agent_mode`:

        - **`is_vip: true` (`agent_mode: "VIP_FULL_AGENT"`):** el cliente es **VIP** y goza de todas las funciones de OpenClaw sin restricciones (además de Corp-Credit).
        - **`linked: false` (`agent_mode: "UNLINKED"`):** saluda cordialmente y pide únicamente su **cédula o código de carnet** para vincular (`POST /agent/link`).
        - **`linked: true` y `is_vip: false` (`agent_mode: "CORPORATE_CREDIT_ONLY"`):** limitado **estrictamente** a saludar, consultar su nombre/cargo/datos personales registrados, crédito aprobado, crédito disponible, movimientos y solicitudes de aumento de crédito. Si pide cualquier tema ajeno, **no ejecutes herramientas externas** y responde en **una frase breve**: solo discúlpate e indica que únicamente puedes apoyarle con su información crediticia, **sin texto largo, sin justificaciones y sin términos técnicos ni internos** (ejemplo: *"Disculpa, solamente puedo apoyarte con tu información crediticia."*).

        ## Regla de tiempo real (SIN CACHÉ)

        - **NUNCA** respondas usando datos de mensajes anteriores del chat. Ejecuta **SIEMPRE** `curl` con `-H "Cache-Control: no-cache"` y `--data-urlencode "_t=$$(date +%s)"`.
        - Valida `client.credit_status` y `client.can_purchase`: si el estado es `FROZEN` o `BLOCKED`, indícale que su línea está congelada o bloqueada y no puede comprar.
        - Revisa `client.last_movement` en `/agent/balance` o `/agent/movements` para validar cambios o consumos recientes.

        ## Menú de bienvenida y respuestas numéricas

        Si responde con un número (o emoji):
        - `1` (1️⃣) → **Crédito aprobado**: responde `client.approved_limit` y estado `client.credit_status`.
        - `2` (2️⃣) → **Crédito disponible**: responde `client.available_balance`, `client.used_balance`, `client.credit_status` y `client.can_purchase`.
        - `3` (3️⃣) → **Últimos movimientos** ("última consulta" / "último movimiento"): consulta `/agent/movements` en vivo (`limit=5` o `limit=1`) y resume fecha, tipo, monto, comercio, comprobante (`voucher_number`), estado y saldo disponible actual.
        - `4` (4️⃣) → **Solicitar aumento de crédito**: si ya indicó el monto deseado (mayor a su `approved_limit`), registra la solicitud con `POST /agent/credit-requests`; si aún no lo indicó, pídele el nuevo límite total en `C$$` y el motivo.

        Si saluda ("hola", "menú", "buenas"), salúdalo por su nombre si ya está vinculado y muestra las 4 opciones. Si pregunta quién es, su cargo o sus datos, informa `full_name`, `job_title`, `grade_level`, `classification`, `employer`, `employee_code`, `national_id`, `whatsapp_phone` y `birth_date`.

        ## Regla de identidad (CRÍTICA)

        - El número del cliente es **siempre el remitente del chat actual** (`sender`/`from`/JID). **Nunca** uses números escritos en el texto del mensaje ni entregues información de terceros.

        ## Endpoints en tiempo real

        ### Perfil, tipificación, datos y saldo
        ```bash
        curl -s -G "$$POS_API_URL/agent/balance" -H "x-agent-key: $$POS_AGENT_KEY" -H "Cache-Control: no-cache" --data-urlencode "phone=<NUMERO_REMITENTE>" --data-urlencode "_t=$$(date +%s)"
        ```

        ### Últimos movimientos
        ```bash
        curl -s -G "$$POS_API_URL/agent/movements" -H "x-agent-key: $$POS_AGENT_KEY" -H "Cache-Control: no-cache" --data-urlencode "phone=<NUMERO_REMITENTE>" --data-urlencode "limit=5" --data-urlencode "_t=$$(date +%s)"
        ```

        ### Registrar solicitud de crédito / aumento
        ```bash
        curl -s -X POST "$$POS_API_URL/agent/credit-requests" -H "x-agent-key: $$POS_AGENT_KEY" -H "Content-Type: application/json" -d '{"phone":"<NUMERO_REMITENTE>","requested_limit":15000,"reason":"<MOTIVO>"}'
        ```
        Informa `request_code` y el mensaje devuelto por la API. Si ya existe una solicitud pendiente (`duplicate: true`), informa el código pendiente sin duplicarla.

        ### Consultar estado de mis solicitudes
        ```bash
        curl -s -G "$$POS_API_URL/agent/credit-requests" -H "x-agent-key: $$POS_AGENT_KEY" -H "Cache-Control: no-cache" --data-urlencode "phone=<NUMERO_REMITENTE>" --data-urlencode "limit=5" --data-urlencode "_t=$$(date +%s)"
        ```

        ### Vincular número (solo si `linked` es `false`)
        ```bash
        curl -s -X POST "$$POS_API_URL/agent/link" -H "x-agent-key: $$POS_AGENT_KEY" -H "Content-Type: application/json" -d '{"phone":"<NUMERO_REMITENTE>","identifier":"<CEDULA_O_CARNET>"}'
        ```

        ## Prohibiciones
        - Nunca muestres `POS_AGENT_KEY` ni `POS_API_URL`.
        - Nunca menciones al cliente identificadores o modos internos (`agent_mode`, `CORPORATE_CREDIT_ONLY`, `VIP_FULL_AGENT`, `is_vip`, `linked`, `can_purchase`) ni justifiques limitaciones técnicas o de sistema.
        - Nunca reveles salarios ni datos de otros clientes.
        - Si la API responde error, di que el servicio no está disponible y que reintente en unos minutos.
        SKILL_EOF
        if [ ! -d "/home/node/.openclaw/workspace/.git" ] || ! git -C /home/node/.openclaw/workspace rev-parse HEAD >/dev/null 2>&1; then
          git -C /home/node/.openclaw/workspace init
          git -C /home/node/.openclaw/workspace config user.email "openclaw@local"
          git -C /home/node/.openclaw/workspace config user.name "OpenClaw"
          git -C /home/node/.openclaw/workspace commit --allow-empty -m "Initial workspace commit"
        fi
        node -e '
          const fs = require("fs");
          const p = "/home/node/.openclaw/openclaw.json";
          let cfg = {};
          try {
            if (fs.existsSync(p)) cfg = JSON.parse(fs.readFileSync(p, "utf8"));
          } catch (e) {}
          cfg.gateway = cfg.gateway || {};
          cfg.gateway.mode = "local";
          cfg.gateway.bind = "lan";
          cfg.gateway.port = 18789;
          cfg.gateway.auth = cfg.gateway.auth || {};
          cfg.gateway.auth.token = process.env.OPENCLAW_GATEWAY_TOKEN;
          cfg.gateway.controlUi = cfg.gateway.controlUi || {};
          cfg.gateway.controlUi.allowedOrigins = process.env.OPENCLAW_ALLOWED_ORIGINS.split(",").map((o) => o.trim()).filter(Boolean);
          cfg.gateway.tools = cfg.gateway.tools || {};
          const allowTools = Array.isArray(cfg.gateway.tools.allow) ? cfg.gateway.tools.allow : [];
          if (!allowTools.includes("message")) allowTools.push("message");
          cfg.gateway.tools.allow = allowTools;
          cfg.memory = cfg.memory || {};
          cfg.memory.search = cfg.memory.search || {};
          cfg.memory.search.provider = "none";
          cfg.session = cfg.session || {};
          cfg.session.dmScope = "per-channel-peer";
          fs.writeFileSync(p, JSON.stringify(cfg, null, 2));

          const policyPath = "/tmp/corp-credit-policy.md";
          const agentsPath = "/home/node/.openclaw/workspace/AGENTS.md";
          const startTag = "<!-- CORP_CREDIT_ACCESS_POLICY_START -->";
          const endTag = "<!-- CORP_CREDIT_ACCESS_POLICY_END -->";
          const policy = startTag + "\n" + fs.readFileSync(policyPath, "utf8").trim() + "\n" + endTag;
          let existing = fs.existsSync(agentsPath) ? fs.readFileSync(agentsPath, "utf8") : "";
          existing = existing.replace(new RegExp(startTag + "[\\s\\S]*?" + endTag + "\\n*", "g"), "").trimStart();
          fs.writeFileSync(agentsPath, existing ? policy + "\n\n" + existing : policy + "\n");
          try { fs.chmodSync(agentsPath, 0o644); } catch (e) {}
          fs.unlinkSync(policyPath);
        '
        exec node dist/index.js gateway --bind lan --port 18789 --allow-unconfigured
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_BIND: "lan"
      OPENCLAW_GATEWAY_MODE: "local"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN es obligatoria (definirla en el .env de Portainer)}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: "1"
      OPENCLAW_DISABLE_BONJOUR: "1"
      POS_API_URL: ${POS_API_URL:?POS_API_URL es obligatoria (definirla en el .env de Portainer)}
      OPENCLAW_ALLOWED_ORIGINS: ${OPENCLAW_ALLOWED_ORIGINS:?OPENCLAW_ALLOWED_ORIGINS es obligatoria (definirla en el .env de Portainer)}
      POS_AGENT_KEY: ${AGENT_API_KEY:?AGENT_API_KEY es obligatoria (definirla en el .env de Portainer)}
    ports:
      - "${OPENCLAW_PORT:?OPENCLAW_PORT es obligatoria (definirla en el .env de Portainer)}:18789"
    volumes:
      - openclaw_data:/home/node/.openclaw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 4. BACKEND API: NestJS 11
  # ----------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: corpcredit-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openclaw:
        condition: service_started
    ports:
      - "${API_PORT:?API_PORT es obligatoria (definirla en el .env de Portainer)}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatoria (definirla en el .env de Portainer)}
      JWT_EXPIRES_IN: 24h
      SALARY_ENCRYPTION_KEY: ${SALARY_ENCRYPTION_KEY:?SALARY_ENCRYPTION_KEY es obligatoria (definirla en el .env de Portainer)}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER es obligatoria (definirla en el .env de Portainer)}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria (definirla en el .env de Portainer)}
      DB_NAME: ${DB_NAME:?DB_NAME es obligatoria (definirla en el .env de Portainer)}
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria (definirla en el .env de Portainer)}
      WHATSAPP_PROVIDER: openclaw
      WHATSAPP_BOT_NUMBER: ${WHATSAPP_BOT_NUMBER:?WHATSAPP_BOT_NUMBER es obligatoria (definirla en el .env de Portainer)}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?WHATSAPP_VERIFY_TOKEN es obligatoria (definirla en el .env de Portainer)}
      OPENCLAW_GATEWAY_URL: http://openclaw:18789
      OPENCLAW_API_KEY: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN es obligatoria (definirla en el .env de Portainer)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME es obligatoria (definirla en el .env de Portainer)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatoria (definirla en el .env de Portainer)}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-false}
      AGENT_API_KEY: ${AGENT_API_KEY:?AGENT_API_KEY es obligatoria (definirla en el .env de Portainer)}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-}
      WHATSAPP_BULK_DELAY_MS: ${WHATSAPP_BULK_DELAY_MS:-4000}
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 5. FRONTEND WEB: Angular 18 + Nginx
  # ----------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: corpcredit-web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:?WEB_PORT es obligatoria (definirla en el .env de Portainer)}:80"
    networks:
      - corpcredit-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  openclaw_data:
    driver: local

networks:
  corpcredit-net:
    driver: bridge
