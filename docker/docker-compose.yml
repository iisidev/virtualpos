version: '3.8'

services:
  # ----------------------------------------------------
  # 1. DATABASE: PostgreSQL 16 (Ledger Inmutable)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: corpcredit-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-pos_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pos_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-corp_credit_pos}
    ports:
      - "${DB_PORT:-22432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pos_admin} -d ${DB_NAME:-corp_credit_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 2. CACHE & LOCKS: Redis 7 Alpine
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: corpcredit-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_pass_2026}
    ports:
      - "${REDIS_PORT:-22379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 3. WHATSAPP GATEWAY: Official OpenClaw (Baileys/Meta)
  # ----------------------------------------------------
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: corpcredit-openclaw
    restart: always
    command:
      - "node"
      - "dist/index.js"
      - "gateway"
      - "--bind"
      - "lan"
      - "--port"
      - "18789"
      - "--allow-unconfigured"
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_BIND: "lan"
      OPENCLAW_GATEWAY_MODE: "local"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-pos_virtual_claw_token_2026}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: "1"
      OPENCLAW_DISABLE_BONJOUR: "1"
    ports:
      - "${OPENCLAW_PORT:-22088}:18789"
    volumes:
      - openclaw_data:/home/node/.openclaw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 4. BACKEND API: NestJS 11
  # ----------------------------------------------------
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: corpcredit-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openclaw:
        condition: service_started
    ports:
      - "${API_PORT:-22300}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      JWT_SECRET: ${JWT_SECRET:-corp_credit_jwt_super_secret_key_2026_finance}
      JWT_EXPIRES_IN: 24h
      SALARY_ENCRYPTION_KEY: ${SALARY_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pos_admin}
      DB_PASSWORD: ${DB_PASSWORD:-pos_secure_pass_2026}
      DB_NAME: ${DB_NAME:-corp_credit_pos}
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_pass_2026}
      WHATSAPP_PROVIDER: openclaw
      WHATSAPP_BOT_NUMBER: ${WHATSAPP_BOT_NUMBER:-50588888888}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-pos_virtual_verify_token_secure}
      OPENCLAW_GATEWAY_URL: http://openclaw:18789
      OPENCLAW_API_KEY: ${OPENCLAW_GATEWAY_TOKEN:-pos_virtual_claw_token_2026}
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 5. FRONTEND WEB: Angular 18 + Nginx
  # ----------------------------------------------------
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: corpcredit-web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-22080}:80"
    networks:
      - corpcredit-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  openclaw_data:
    driver: local

networks:
  corpcredit-net:
    driver: bridge
