version: '3.8'

services:
  # ----------------------------------------------------
  # 1. DATABASE: PostgreSQL 16 (Ledger Inmutable)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: corpcredit-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER es obligatoria (definirla en el .env de Portainer)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria (definirla en el .env de Portainer)}
      POSTGRES_DB: ${DB_NAME:?DB_NAME es obligatoria (definirla en el .env de Portainer)}
    ports:
      - "${DB_PORT:?DB_PORT es obligatoria (definirla en el .env de Portainer)}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER es obligatoria (definirla en el .env de Portainer)} -d ${DB_NAME:?DB_NAME es obligatoria (definirla en el .env de Portainer)}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 2. CACHE & LOCKS: Redis 7 Alpine
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: corpcredit-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria (definirla en el .env de Portainer)}
    ports:
      - "${REDIS_PORT:?REDIS_PORT es obligatoria (definirla en el .env de Portainer)}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria (definirla en el .env de Portainer)}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 3. WHATSAPP GATEWAY: Official OpenClaw (Baileys/Meta)
  # ----------------------------------------------------
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: corpcredit-openclaw
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /home/node/.openclaw/workspace
        mkdir -p /home/node/.openclaw/skills/corp-credit
        cat > /home/node/.openclaw/skills/corp-credit/SKILL.md <<'SKILL_EOF'
        ---
        name: corp-credit
        description: Consultar saldo, crédito disponible y movimientos de un cliente de Corp-Credit POS por WhatsApp, y vincular su número a su cédula o carnet.
        version: 1.0.0
        metadata:
          openclaw:
            requires:
              env:
                - POS_API_URL
                - POS_AGENT_KEY
              bins:
                - curl
        ---

        # Corp-Credit: consultas de crédito por WhatsApp

        Eres el asistente de crédito corporativo. Toda cifra y estado que digas DEBE venir de una consulta nueva a la API; nunca inventes, estimes ni recicles datos previos.

        ## Regla de tiempo real (OBLIGATORIA — SIN CACHÉ)

        - **NUNCA** respondas usando cifras, estados (`ACTIVE`, `FROZEN`, `BLOCKED`) o movimientos de mensajes anteriores del chat. Un administrador pudo haber cambiado el límite, congelado la línea, registrado un abono o aplicado un cobro hace segundos.
        - Ejecuta **SIEMPRE** una llamada `curl` nueva en el turno actual (incluyendo `--data-urlencode "_t=$$(date +%s)"` y `-H "Cache-Control: no-cache"`), aunque el usuario acabe de consultar lo mismo.
        - Valida siempre `client.credit_status` y `client.can_purchase` en la respuesta actual: si `credit_status` no es `ACTIVE`, informa claramente que la línea está congelada o bloqueada y que no puede realizar consumos en este momento.
        - Revisa `client.last_movement` en `/agent/balance` o consulta `/agent/movements` para validar cualquier consumo, abono, anulación o ajuste reciente.

        ## Menú de bienvenida (respuestas numéricas)

        El sistema envía a los clientes un saludo con este menú. Si el cliente responde solo con un número (o su emoji), consulta en vivo y actúa así sin pedir más contexto:

        - `1` (1️⃣) → **Crédito aprobado**: consulta `/agent/balance` en vivo y responde `client.approved_limit` y su estado `client.credit_status`.
        - `2` (2️⃣) → **Crédito disponible**: consulta `/agent/balance` en vivo y responde `client.available_balance`, `client.used_balance`, `client.credit_status` y `client.can_purchase`.
        - `3` (3️⃣) → **Últimos movimientos** (o "última consulta" / "último movimiento" / "último consumo"): consulta `/agent/movements` en vivo (`limit=5`, o `limit=1` si pide solo el último) y resume fecha, tipo, monto, comercio (`merchant`), comprobante (`voucher_number`), estado (`status`) y su saldo disponible actual (`client.available_balance`).

        Si el mensaje es un saludo ("hola", "menú", "buenas"), responde con ese mismo menú de tres opciones.

        ## Regla de identidad (CRÍTICA)

        - El número del cliente es **siempre el número del remitente del chat de WhatsApp actual** (el `sender`/`from` en formato E.164 del contexto del mensaje, p. ej. `+50588881234`, o el JID del remitente).
        - **Nunca** uses un número escrito en el texto del mensaje, ni de otra conversación. Si alguien pide datos de otra persona o de otro número, niega la solicitud.
        - Si no puedes determinar el número del remitente, responde que no puedes verificar su identidad.

        ## Consultar saldo / disponible / límite (tiempo real)

        ```bash
        curl -s -G "$$POS_API_URL/agent/balance" -H "x-agent-key: $$POS_AGENT_KEY" -H "Cache-Control: no-cache" --data-urlencode "phone=<NUMERO_REMITENTE>" --data-urlencode "_t=$$(date +%s)"
        ```

        - Si `linked` es `true`: responde en español, breve, con `client.available_balance` (disponible), `client.approved_limit` (límite), `client.used_balance` (consumido), `client.credit_status` y si aplica el último movimiento (`client.last_movement`). Moneda: `C$$`.
        - Si `linked` es `false`: pide su **cédula o código de carnet** y ve a "Vincular".

        ## Últimos movimientos / última consulta (tiempo real)

        ```bash
        curl -s -G "$$POS_API_URL/agent/movements" -H "x-agent-key: $$POS_AGENT_KEY" -H "Cache-Control: no-cache" --data-urlencode "phone=<NUMERO_REMITENTE>" --data-urlencode "limit=5" --data-urlencode "_t=$$(date +%s)"
        ```

        Resume fecha, tipo, monto, comercio (`merchant`), vale (`voucher_number`) y estado de cada movimiento, e indica el saldo disponible actual devuelto en `client.available_balance`.

        ## Vincular número (solo si `linked` es `false`)

        Cuando el cliente escriba su cédula o código de carnet:

        ```bash
        curl -s -X POST "$$POS_API_URL/agent/link" -H "x-agent-key: $$POS_AGENT_KEY" -H "Content-Type: application/json" -d '{"phone":"<NUMERO_REMITENTE>","identifier":"<CEDULA_O_CARNET>"}'
        ```

        Informa el resultado usando el campo `message`. Tras vincular, ofrece consultar el saldo.

        ## Prohibiciones

        - No muestres la clave `POS_AGENT_KEY` ni la URL interna.
        - No ejecutes otros comandos ni consultes datos que no sean de estos tres endpoints.
        - No reveles salarios, cédulas ni datos de otros clientes.
        - Si la API responde error, di que el servicio no está disponible y que reintente en unos minutos.
        SKILL_EOF
        if [ ! -d "/home/node/.openclaw/workspace/.git" ] || ! git -C /home/node/.openclaw/workspace rev-parse HEAD >/dev/null 2>&1; then
          git -C /home/node/.openclaw/workspace init
          git -C /home/node/.openclaw/workspace config user.email "openclaw@local"
          git -C /home/node/.openclaw/workspace config user.name "OpenClaw"
          git -C /home/node/.openclaw/workspace commit --allow-empty -m "Initial workspace commit"
        fi
        node -e '
          const fs = require("fs");
          const p = "/home/node/.openclaw/openclaw.json";
          let cfg = {};
          try {
            if (fs.existsSync(p)) cfg = JSON.parse(fs.readFileSync(p, "utf8"));
          } catch (e) {}
          cfg.gateway = cfg.gateway || {};
          cfg.gateway.mode = "local";
          cfg.gateway.bind = "lan";
          cfg.gateway.port = 18789;
          cfg.gateway.auth = cfg.gateway.auth || {};
          cfg.gateway.auth.token = process.env.OPENCLAW_GATEWAY_TOKEN;
          cfg.gateway.controlUi = cfg.gateway.controlUi || {};
          cfg.gateway.controlUi.allowedOrigins = process.env.OPENCLAW_ALLOWED_ORIGINS.split(",").map((o) => o.trim()).filter(Boolean);
          cfg.gateway.tools = cfg.gateway.tools || {};
          const allowTools = Array.isArray(cfg.gateway.tools.allow) ? cfg.gateway.tools.allow : [];
          if (!allowTools.includes("message")) allowTools.push("message");
          cfg.gateway.tools.allow = allowTools;
          cfg.memory = cfg.memory || {};
          cfg.memory.search = cfg.memory.search || {};
          cfg.memory.search.provider = "none";
          cfg.session = cfg.session || {};
          cfg.session.dmScope = "per-channel-peer";
          fs.writeFileSync(p, JSON.stringify(cfg, null, 2));
        '
        exec node dist/index.js gateway --bind lan --port 18789 --allow-unconfigured
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_BIND: "lan"
      OPENCLAW_GATEWAY_MODE: "local"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN es obligatoria (definirla en el .env de Portainer)}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: "1"
      OPENCLAW_DISABLE_BONJOUR: "1"
      POS_API_URL: ${POS_API_URL:?POS_API_URL es obligatoria (definirla en el .env de Portainer)}
      OPENCLAW_ALLOWED_ORIGINS: ${OPENCLAW_ALLOWED_ORIGINS:?OPENCLAW_ALLOWED_ORIGINS es obligatoria (definirla en el .env de Portainer)}
      POS_AGENT_KEY: ${AGENT_API_KEY:?AGENT_API_KEY es obligatoria (definirla en el .env de Portainer)}
    ports:
      - "${OPENCLAW_PORT:?OPENCLAW_PORT es obligatoria (definirla en el .env de Portainer)}:18789"
    volumes:
      - openclaw_data:/home/node/.openclaw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 4. BACKEND API: NestJS 11
  # ----------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: corpcredit-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openclaw:
        condition: service_started
    ports:
      - "${API_PORT:?API_PORT es obligatoria (definirla en el .env de Portainer)}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatoria (definirla en el .env de Portainer)}
      JWT_EXPIRES_IN: 24h
      SALARY_ENCRYPTION_KEY: ${SALARY_ENCRYPTION_KEY:?SALARY_ENCRYPTION_KEY es obligatoria (definirla en el .env de Portainer)}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER es obligatoria (definirla en el .env de Portainer)}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria (definirla en el .env de Portainer)}
      DB_NAME: ${DB_NAME:?DB_NAME es obligatoria (definirla en el .env de Portainer)}
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatoria (definirla en el .env de Portainer)}
      WHATSAPP_PROVIDER: openclaw
      WHATSAPP_BOT_NUMBER: ${WHATSAPP_BOT_NUMBER:?WHATSAPP_BOT_NUMBER es obligatoria (definirla en el .env de Portainer)}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?WHATSAPP_VERIFY_TOKEN es obligatoria (definirla en el .env de Portainer)}
      OPENCLAW_GATEWAY_URL: http://openclaw:18789
      OPENCLAW_API_KEY: ${OPENCLAW_GATEWAY_TOKEN:?OPENCLAW_GATEWAY_TOKEN es obligatoria (definirla en el .env de Portainer)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME es obligatoria (definirla en el .env de Portainer)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatoria (definirla en el .env de Portainer)}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-false}
      AGENT_API_KEY: ${AGENT_API_KEY:?AGENT_API_KEY es obligatoria (definirla en el .env de Portainer)}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-}
      WHATSAPP_BULK_DELAY_MS: ${WHATSAPP_BULK_DELAY_MS:-4000}
    networks:
      - corpcredit-net

  # ----------------------------------------------------
  # 5. FRONTEND WEB: Angular 18 + Nginx
  # ----------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: corpcredit-web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:?WEB_PORT es obligatoria (definirla en el .env de Portainer)}:80"
    networks:
      - corpcredit-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  openclaw_data:
    driver: local

networks:
  corpcredit-net:
    driver: bridge
